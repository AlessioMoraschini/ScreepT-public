# ScreepT Dark: IntelliJ IDEA "New UI" dark palette on top of FlatDarkLaf.
# Only overrides of FlatDarkLaf.properties, syntax: https://www.formdev.com/flatlaf/properties-files/
#
#   #1E1F22 content (text, lists, trees, tables)    #2B2D30 panels, menus, headers
#   #393B40 separators / hover                      #4E5157 component borders
#   #3574F0 accent                                  #2E436E selection
#   #DFE1E5 text                                    #6F737A disabled text

#---- palette ----

@background = #2B2D30
@foreground = #DFE1E5
@disabledForeground = #6F737A
@componentBackground = #1E1F22
@buttonBackground = #35373B
@menuBackground = #2B2D30

@selectionBackground = #2E436E
@selectionForeground = #DFE1E5
@selectionInactiveBackground = #393B40
@selectionInactiveForeground = #DFE1E5
@menuSelectionBackground = #2E436E
@menuHoverBackground = #393B40
@cellFocusColor = #2E436E

# fixed accent: ignore the Windows accent color
@accentColor = #3574F0
@accentBaseColor = #3574F0
@accentFocusColor = #3574F0
@accentLinkColor = #548AF7
@accentSelectionBackground = #2E436E
@accentButtonDefaultBackground = #3574F0
@accentUnderlineColor = #3574F0
@accentSliderColor = #3574F0

defaultFont = +1

#---- lightness: no animations, no shadows, native frames ----

ScrollPane.smoothScrolling = false
Popup.dropShadowPainted = false
TitlePane.useWindowDecorations = false

#---- components ----

Component.arc = 6
Button.arc = 6
TextComponent.arc = 6
Component.focusWidth = 0
Component.innerFocusWidth = 1
Component.borderColor = #4E5157
Component.disabledBorderColor = #393B40
Component.focusColor = #3574F0
Component.focusedBorderColor = #3574F0

Button.borderColor = #4E5157
Button.hoverBorderColor = #5A5D63
Button.focusedBorderColor = #3574F0
Button.default.foreground = #FFFFFF
Button.default.borderColor = #3574F0
Button.default.hoverBorderColor = #548AF7
Button.default.focusedBorderColor = #548AF7
Button.default.boldText = false

CheckBox.icon.background = #1E1F22
CheckBox.icon.borderColor = #5A5D63
CheckBox.icon.selectedBackground = #3574F0
CheckBox.icon.selectedBorderColor = #3574F0
CheckBox.icon.checkmarkColor = #FFFFFF

ScrollBar.width = 10
ScrollBar.track = #1E1F22
ScrollBar.hoverTrackColor = #1E1F22
ScrollBar.thumb = #4A4D52
ScrollBar.hoverThumbColor = #5A5D63
ScrollBar.pressedThumbColor = #6F737A

Separator.foreground = #393B40
PopupMenu.borderColor = #43454A
ToolTip.background = #393B40
ToolTip.foreground = #DFE1E5
ProgressBar.background = #393B40
ProgressBar.foreground = #3574F0

TabbedPane.hoverColor = #393B40
TabbedPane.contentAreaColor = #393B40

Table.gridColor = #393B40
TableHeader.background = #2B2D30
TableHeader.separatorColor = #393B40
TableHeader.bottomSeparatorColor = #393B40
Tree.hash = #393B40
