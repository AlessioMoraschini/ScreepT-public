crypter.guide_html=<h2>Creept：加密和解密你的文件</h2><p>Creept 绝不会修改你的原始文件：它总是在你选择的文件夹中生成加密（或解密）后的<b>副本</b>。</p><h3>加密</h3><ol><li>将文件或文件夹拖到右侧面板，或点击 <b>Add Source File or Folder</b>。</li><li>在顶部栏选择保护方式。推荐使用 <b>Secure: AES-256-GCM</b>。通过 <b>Options...</b> 可以组合 AES-128、AES-256、密钥图像（StegaCREEPT）和 Shuffle，选择密码转换为密钥的方式（PBKDF2 或 scrypt），以及文件夹的保存方式。</li><li>输入密码：整个密码都会生效，因此最好使用较长的短语。如果所选模式需要密钥图像，请在左侧选择（<b>One-Use</b> 或从 Vault 中选择）。</li><li>点击 <b>Creept</b> 并选择目标位置：结果会保存在一个名称包含日期和时间的新文件夹中。</li></ol><h3>解密</h3><ol><li>拖入已加密的文件：<i>.scpt</i> 文件、<i>.dir.scpt</i> 压缩包，或包含它们的 zip。</li><li>输入密码（如果文件需要，还要选择密钥图像）。所选模式并不重要：算法会直接从文件中读取。</li><li>点击 <b>DeCreept</b>。如果密码错误，或文件已损坏或被修改，则不会写入任何内容，并显示错误。</li></ol><h3>文件夹</h3><p>默认情况下，文件夹会变成<b>一个加密压缩包</b>（<i>名称.dir.scpt</i>），因此文件名和结构也会被隐藏。在 <b>Options...</b> 中，你可以保留文件夹结构并分别加密每个文件，或生成由加密文件组成的 zip。</p><h3>须知</h3><ul><li>如果丢失密码或密钥图像，任何人都无法恢复你的文件。请备份原始文件和密钥，并且不要把它们放在加密文件旁边。</li><li>控件下方的一行文字会说明当前选择如何保护你的数据，以及密码的强度。将鼠标停在任意控件上即可查看其作用。</li><li><b>Legacy</b> 模式（旧的 AES-128 和带密钥图像的 PNG 文件）仅用于打开旧文件：请优先使用 <b>Secure</b> 模式。</li><li>此模块仍处于测试阶段，尚未经过独立专家审查：不要将其作为重要数据的唯一保护手段。</li></ul>
