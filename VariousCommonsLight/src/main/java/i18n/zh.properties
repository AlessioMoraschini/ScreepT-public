crypter.when_this_mode_is_active_an=启用此模式后，会额外增加一个阶段，根据密钥值重新排列字节，以提高算法安全性并最大化熵扩散。 <br/> <b>注意：</b> <u>解密时无需选择正确的选项</u>，程序会根据编码后的图像文件名自动识别。
crypter.when_this_mode_is_active_the=启用此模式后，输入的密码会被哈希处理，即使数据被泄露，也无法还原出原始密码。 <br/> <b>注意：</b> <u>解密时无需选择正确的选项</u>，程序会根据编码后的文件自动识别。
crypter.only_aes_mode_uses_aes_algorithm=<u>ONLY_AES 模式</u>使用 AES 算法（128 位）对数据副本进行加密/解密。<br/> 使用时<u>只需指定一个文本密码</u>（或随机生成一个新密码……请务必记住它）。最佳长度为 16 个字符。<br/><br/> <b>注意：</b> 此模式下可以选择对密码进行哈希和/或打乱原始字节顺序以最大化安全性，但处理速度会更慢。
crypter.only_steg_mode_uses_brand_new=<u>ONLY_STEG 模式</u>使用全新的 STEG 算法对数据副本进行加密/解密。 <br/>使用时只需指定一张 PNG 格式的密钥图像作为密码。<br/> 可以加载一次性图像、随机生成新图像，或从字典中选择一张。<br/> <u>没有密钥图像就无法解密</u>已加密的数据副本：请妥善保管！（建议使用 U 盘）<br/><br/> <b>注意：</b> 此模式下可以选择打乱原始字节顺序以最大化安全性，但处理速度会更慢；不支持密钥哈希。
crypter.complete_mode_is_the_maximum_security=<u>COMPLETE 模式</u>是最高安全模式，结合 AES 128 位和 STEG 算法对数据副本进行加密/解密。 <br/> 使用时需要同时指定 AES 密码和一张 PNG 密钥图像（作为附加密码）。<br/> 可以加载一次性图像、随机生成新图像，或从字典中选择一张：请小心并妥善保管。<br/> <u>没有密码和密钥图像就无法解密</u>已加密的数据副本！（建议使用 U 盘）<br/><br/> <b>注意：</b> 此模式下可以选择对密码进行哈希和/或打乱原始字节顺序以最大化安全性，但处理速度会更慢。
