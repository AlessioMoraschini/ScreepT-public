crypter.the_crypter_module_is_in_beta=<html><body style='width:430px'><b>Le module Crypter est en version bêta.</b><br><br>Il est expérimental et n'a pas encore été testé en profondeur. Ses algorithmes n'ont pas été examinés par des experts indépendants : ne vous y fiez pas comme unique protection de données importantes et conservez une copie indépendante de vos fichiers d'origine et de vos clés. Un bogue ou une clé perdue peut rendre les fichiers chiffrés impossibles à récupérer.<br><br>Les mises à jour des prochaines semaines et des prochains mois amélioreront le Crypter et son intégration dans ScreepT, et ajouteront de nouvelles fonctions.</body></html>
