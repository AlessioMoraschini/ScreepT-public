crypter.when_this_mode_is_active_an=Lorsque ce mode est actif, une phase supplémentaire réordonne les octets selon les valeurs de la clé, afin d'augmenter la sécurité de l'algorithme et de maximiser la diffusion de l'entropie. <br/> <b>NB : </b> <u>Au déchiffrement, il n'est pas nécessaire de choisir la bonne option</u> : elle est reconnue automatiquement à partir du nom du fichier image encodé.
crypter.when_this_mode_is_active_the=Lorsque ce mode est actif, le mot de passe saisi est haché afin d'empêcher de retrouver le mot de passe d'origine même si les données sont compromises. <br/> <b>NB :</b> <u>Au déchiffrement, il n'est pas nécessaire de choisir la bonne option</u> : elle est reconnue automatiquement à partir du fichier encodé.
crypter.only_aes_mode_uses_aes_algorithm=<u>Le mode ONLY_AES</u> utilise l'algorithme AES (128 bits) pour chiffrer/déchiffrer une copie de vos données.<br/> Pour l'utiliser, <u>il suffit d'indiquer un mot de passe texte</u> (ou d'en générer un nouveau au hasard... pensez à le retenir). La longueur idéale est de 16 caractères.<br/><br/> <b>NB :</b> Avec ce mode, vous pouvez choisir de hacher le mot de passe et/ou de mélanger les octets d'origine pour maximiser la sécurité, au prix d'un traitement plus lent.
crypter.only_steg_mode_uses_brand_new=<u>Le mode ONLY_STEG</u> utilise le nouvel algorithme STEG pour chiffrer/déchiffrer une copie de vos données. <br/>Pour l'utiliser, il suffit d'indiquer une image clé au format PNG qui servira de mot de passe.<br/> Vous pouvez charger une image à usage unique, en générer une nouvelle au hasard ou en choisir une dans votre dictionnaire.<br/> <u>Sans l'image clé, vous ne pourrez pas déchiffrer</u> la copie chiffrée de vos données : conservez-la en lieu sûr ! (je vous conseille une clé USB)<br/><br/> <b>NB :</b> Avec ce mode, vous pouvez choisir de mélanger les octets d'origine pour maximiser la sécurité, avec un traitement plus lent ; le hachage de la clé n'est pas pris en charge.
crypter.complete_mode_is_the_maximum_security=<u>Le mode COMPLETE</u> est le mode de sécurité maximale : il combine AES 128 bits et l'algorithme STEG pour chiffrer/déchiffrer une copie de vos données. <br/> Pour l'utiliser, vous devez indiquer à la fois le mot de passe AES et une image clé PNG qui servira de mot de passe supplémentaire.<br/> Vous pouvez charger une image à usage unique, en générer une nouvelle au hasard ou en choisir une dans votre dictionnaire : soyez prudent et conservez-la en lieu sûr.<br/> <u>Sans le mot de passe et l'image clé, vous ne pourrez pas déchiffrer</u> la copie chiffrée de vos données ! (je vous conseille une clé USB)<br/><br/> <b>NB :</b> Avec ce mode, vous pouvez choisir de hacher le mot de passe et/ou de mélanger les octets d'origine pour maximiser la sécurité, avec un traitement plus lent.
