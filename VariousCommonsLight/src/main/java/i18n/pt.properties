launcher.gc_parallel_desc=Várias threads limpam a memória: melhor desempenho, um pouco mais de RAM, pausas mais longas em heaps grandes.
launcher.gc_g1_desc=Pausas equilibradas em heaps grandes, com mais memória para as estruturas internas. Útil se a interface travar durante as limpezas.
