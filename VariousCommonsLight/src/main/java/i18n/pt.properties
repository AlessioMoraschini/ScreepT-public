crypter.guide_html=<h2>Creept: cifre e decifre os seus ficheiros</h2><p>O Creept nunca altera os seus originais: cria sempre uma <b>cópia</b> cifrada (ou decifrada) na pasta que escolher.</p><h3>Cifrar</h3><ol><li>Arraste ficheiros ou pastas para o painel da direita, ou prima <b>Add Source File or Folder</b>.</li><li>Escolha a proteção na barra superior. <b>Secure: AES-256-GCM</b> é a recomendada. <b>Options...</b> permite combinar AES-128, AES-256, uma imagem-chave (StegaCREEPT) e Shuffle, escolher como a palavra-passe se transforma em chave (PBKDF2 ou scrypt) e como as pastas são guardadas.</li><li>Escreva a palavra-passe: conta a palavra-passe inteira, por isso o melhor é uma frase longa. Se o modo precisar de uma imagem-chave, escolha-a à esquerda (<b>One-Use</b> ou a partir do Vault).</li><li>Prima <b>Creept</b> e escolha o destino: o resultado é guardado numa nova pasta com a data e a hora no nome.</li></ol><h3>Decifrar</h3><ol><li>Arraste os ficheiros cifrados: ficheiros <i>.scpt</i>, arquivos <i>.dir.scpt</i> ou zips que os contenham.</li><li>Escreva a palavra-passe (e escolha a imagem-chave, se os ficheiros a exigirem). O modo selecionado não importa: os algoritmos são lidos do próprio ficheiro.</li><li>Prima <b>DeCreept</b>. Com uma palavra-passe errada, ou se o ficheiro estiver danificado ou tiver sido alterado, nada é escrito e aparece um erro.</li></ol><h3>Pastas</h3><p>Por predefinição, uma pasta torna-se <b>um único arquivo cifrado</b> (<i>nome.dir.scpt</i>), pelo que os nomes dos ficheiros e a estrutura também ficam escondidos. Em <b>Options...</b> pode manter a estrutura das pastas cifrando cada ficheiro em separado, ou obter um zip de ficheiros cifrados.</p><h3>Bom saber</h3><ul><li>Se perder a palavra-passe ou a imagem-chave, ninguém consegue recuperar os seus ficheiros. Guarde uma cópia dos originais e das chaves, e nunca as deixe junto dos ficheiros cifrados.</li><li>A linha por baixo dos controlos indica como a escolha atual protege os seus dados e quão forte é a palavra-passe. Passe o rato sobre qualquer controlo para ler para que serve.</li><li>Os modos <b>Legacy</b> (o antigo AES-128 e ficheiros PNG com imagem-chave) servem apenas para abrir ficheiros antigos: prefira um modo <b>Secure</b>.</li><li>Este módulo ainda está em fase beta e não foi revisto por especialistas independentes: não confie nele como única proteção de dados importantes.</li></ul>
