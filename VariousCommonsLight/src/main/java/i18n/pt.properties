crypter.the_crypter_module_is_in_beta=<html><body style='width:430px'><b>O módulo Crypter está em versão beta.</b><br><br>Ele é experimental e ainda não foi testado a fundo. Seus algoritmos não foram revisados por especialistas independentes: não confie nele como única proteção de dados importantes e mantenha uma cópia independente dos seus arquivos originais e das suas chaves. Um bug ou uma chave perdida pode tornar impossível recuperar os arquivos criptografados.<br><br>As atualizações das próximas semanas e meses vão melhorar o Crypter e sua integração ao ScreepT, e adicionar novos recursos.</body></html>
