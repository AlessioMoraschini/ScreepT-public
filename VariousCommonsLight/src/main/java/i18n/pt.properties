crypter.when_this_mode_is_active_an=Quando este modo está ativo, uma fase adicional reordena os bytes com base nos valores da chave, para aumentar a segurança do algoritmo e maximizar a difusão da entropia. <br/> <b>NB: </b> <u>Ao descriptografar não é preciso escolher a opção certa</u>: ela é reconhecida automaticamente a partir do nome do arquivo de imagem codificado.
crypter.when_this_mode_is_active_the=Quando este modo está ativo, a senha informada passa por hash para evitar que a senha original seja descoberta mesmo que os dados sejam comprometidos. <br/> <b>NB:</b> <u>Ao descriptografar não é preciso escolher a opção certa</u>: ela é reconhecida automaticamente a partir do arquivo codificado.
crypter.only_aes_mode_uses_aes_algorithm=<u>O modo ONLY_AES</u> usa o algoritmo AES (128 bits) para criptografar/descriptografar uma cópia dos seus dados.<br/> Para usá-lo, <u>basta informar uma senha em texto</u> (ou gerar uma nova aleatória... só não esqueça de memorizá-la). O melhor comprimento é de 16 caracteres.<br/><br/> <b>NB:</b> Com este modo você pode escolher aplicar hash à senha e/ou embaralhar os bytes originais para maximizar a segurança, com um processo mais lento.
crypter.only_steg_mode_uses_brand_new=<u>O modo ONLY_STEG</u> usa o novo algoritmo STEG para criptografar/descriptografar uma cópia dos seus dados. <br/>Para usá-lo, basta informar uma imagem-chave com extensão PNG, que será a sua senha.<br/> Você pode carregar uma imagem de uso único, gerar uma nova aleatória ou escolher uma do seu dicionário.<br/> <u>Sem a imagem-chave você não conseguirá descriptografar</u> a cópia criptografada dos seus dados: guarde-a em um lugar seguro! (sugiro um pen drive USB)<br/><br/> <b>NB:</b> Com este modo você pode escolher embaralhar os bytes originais para maximizar a segurança, com um processo mais lento; o hash da chave não é suportado.
crypter.complete_mode_is_the_maximum_security=<u>O modo COMPLETE</u> é o de máxima segurança: combina AES de 128 bits e o algoritmo STEG para criptografar/descriptografar uma cópia dos seus dados. <br/> Para usá-lo, você precisa informar tanto a senha AES quanto uma imagem-chave PNG, que servirá como senha adicional.<br/> Você pode carregar uma imagem de uso único, gerar uma nova aleatória ou escolher uma do seu dicionário: tenha cuidado e guarde-a em um lugar seguro.<br/> <u>Sem a senha e a imagem-chave você não conseguirá descriptografar</u> a cópia criptografada dos seus dados! (sugiro um pen drive USB)<br/><br/> <b>NB:</b> Com este modo você pode escolher aplicar hash à senha e/ou embaralhar os bytes originais para maximizar a segurança, com um processo mais lento.
