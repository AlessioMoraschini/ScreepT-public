crypter.the_crypter_module_is_in_beta=<html><body style='width:430px'><b>El módulo Crypter está en versión beta.</b><br><br>Es experimental y todavía no se ha probado a fondo. Sus algoritmos no han sido revisados por expertos independientes: no confíes en él como única protección de datos importantes y conserva una copia independiente de tus archivos originales y de tus claves. Un error o una clave perdida pueden hacer imposible recuperar los archivos cifrados.<br><br>Las actualizaciones de las próximas semanas y meses mejorarán el Crypter y su integración en ScreepT, y añadirán nuevas funciones.</body></html>
