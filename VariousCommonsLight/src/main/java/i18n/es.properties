crypter.when_this_mode_is_active_an=Cuando este modo está activo, una fase adicional reordena los bytes según los valores de la clave, para aumentar la seguridad del algoritmo y maximizar la difusión de la entropía. <br/> <b>NB: </b> <u>Al descifrar no hace falta elegir la opción correcta</u>: se reconoce automáticamente a partir del nombre del archivo de imagen codificado.
crypter.when_this_mode_is_active_the=Cuando este modo está activo, la contraseña indicada se convierte en un hash para evitar que se pueda obtener la contraseña original aunque los datos se vean comprometidos. <br/> <b>NB:</b> <u>Al descifrar no hace falta elegir la opción correcta</u>: se reconoce automáticamente a partir del archivo codificado.
crypter.only_aes_mode_uses_aes_algorithm=<u>El modo ONLY_AES</u> usa el algoritmo AES (128 bits) para cifrar/descifrar una copia de tus datos.<br/> Para usarlo <u>solo tienes que indicar una contraseña de texto</u> (o generar una nueva aleatoria... asegúrate de recordarla). La longitud ideal es de 16 caracteres.<br/><br/> <b>NB:</b> Con este modo puedes elegir aplicar un hash a la contraseña y/o mezclar los bytes originales para maximizar la seguridad, con un proceso más lento.
crypter.only_steg_mode_uses_brand_new=<u>El modo ONLY_STEG</u> usa el nuevo algoritmo STEG para cifrar/descifrar una copia de tus datos. <br/>Para usarlo solo tienes que indicar una imagen clave con extensión PNG que será tu contraseña.<br/> Puedes cargar una imagen de un solo uso, generar una nueva aleatoria o elegir una de tu diccionario.<br/> <u>Sin la imagen clave no podrás descifrar</u> la copia cifrada de tus datos: ¡guárdala en un lugar seguro! (te sugiero una memoria USB)<br/><br/> <b>NB:</b> Con este modo puedes elegir mezclar los bytes originales para maximizar la seguridad, con un proceso más lento; el hash de la clave no es compatible.
crypter.complete_mode_is_the_maximum_security=<u>El modo COMPLETE</u> es el de máxima seguridad: combina AES de 128 bits y el algoritmo STEG para cifrar/descifrar una copia de tus datos. <br/> Para usarlo debes indicar tanto la contraseña AES como una imagen clave PNG que actuará como contraseña adicional.<br/> Puedes cargar una imagen de un solo uso, generar una nueva aleatoria o elegir una de tu diccionario: ten cuidado y guárdala en un lugar seguro.<br/> <u>Sin la contraseña y la imagen clave no podrás descifrar</u> la copia cifrada de tus datos. (te sugiero una memoria USB)<br/><br/> <b>NB:</b> Con este modo puedes elegir aplicar un hash a la contraseña y/o mezclar los bytes originales para maximizar la seguridad, con un proceso más lento.
