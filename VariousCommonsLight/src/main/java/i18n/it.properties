crypter.when_this_mode_is_active_an=Quando questa modalità è attiva, una fase aggiuntiva riordina i byte in base ai valori della chiave, per aumentare la sicurezza dell'algoritmo e massimizzare la diffusione dell'entropia. <br/> <b>NB: </b> <u>In decifratura non serve scegliere l'opzione giusta</u>: viene riconosciuta automaticamente dal nome del file immagine codificato.
crypter.when_this_mode_is_active_the=Quando questa modalità è attiva, la password inserita viene sottoposta a hash per evitare che la password originale possa essere ricavata anche se i dati vengono compromessi. <br/> <b>NB:</b> <u>In decifratura non serve scegliere l'opzione giusta</u>: viene riconosciuta automaticamente dal file codificato.
crypter.only_aes_mode_uses_aes_algorithm=<u>La modalità ONLY_AES</u> usa l'algoritmo AES (128 bit) per cifrare/decifrare una copia dei tuoi dati.<br/> Per usarla <u>basta specificare una password testuale</u> (o generarne una nuova casuale... ricordati di annotarla). La lunghezza migliore è 16 caratteri.<br/><br/> <b>NB:</b> Con questa modalità puoi scegliere di fare l'hash della password e/o rimescolare i byte originali per massimizzare la sicurezza, con un processo più lento.
crypter.only_steg_mode_uses_brand_new=<u>La modalità ONLY_STEG</u> usa il nuovo algoritmo STEG per cifrare/decifrare una copia dei tuoi dati. <br/>Per usarla basta specificare un'immagine chiave con estensione PNG che sarà la tua password.<br/> Puoi caricare un'immagine monouso, generarne una nuova casuale oppure sceglierne una dal tuo dizionario.<br/> <u>Senza l'immagine chiave non potrai decifrare</u> la copia cifrata dei tuoi dati: conservala in un posto sicuro! (consiglio una chiavetta USB)<br/><br/> <b>NB:</b> Con questa modalità puoi scegliere di rimescolare i byte originali per massimizzare la sicurezza, con un processo più lento; l'hash della chiave non è supportato.
crypter.complete_mode_is_the_maximum_security=<u>La modalità COMPLETE</u> è la modalità di massima sicurezza: combina AES a 128 bit e l'algoritmo STEG per cifrare/decifrare una copia dei tuoi dati. <br/> Per usarla devi specificare sia la password AES sia un'immagine chiave PNG che farà da password aggiuntiva.<br/> Puoi caricare un'immagine monouso, generarne una nuova casuale oppure sceglierne una dal tuo dizionario: fai attenzione e conservala in un posto sicuro.<br/> <u>Senza password e immagine chiave non potrai decifrare</u> la copia cifrata dei tuoi dati! (consiglio una chiavetta USB)<br/><br/> <b>NB:</b> Con questa modalità puoi scegliere di fare l'hash della password e/o rimescolare i byte originali per massimizzare la sicurezza, con un processo più lento.
