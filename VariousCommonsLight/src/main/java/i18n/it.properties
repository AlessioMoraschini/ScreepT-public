crypter.the_crypter_module_is_in_beta=<html><body style='width:430px'><b>Il modulo Crypter è in versione beta.</b><br><br>È sperimentale e non è ancora stato testato a fondo. I suoi algoritmi non sono stati verificati da esperti indipendenti: non affidarti ad esso come unica protezione di dati importanti e conserva una copia indipendente dei file originali e delle tue chiavi. Un bug o una chiave persa possono rendere impossibile il recupero dei file cifrati.<br><br>Gli aggiornamenti delle prossime settimane e mesi miglioreranno il Crypter e la sua integrazione in ScreepT e aggiungeranno nuove funzioni.</body></html>
