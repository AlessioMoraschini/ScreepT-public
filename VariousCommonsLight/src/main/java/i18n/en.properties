crypter.guide_html=<h2>Creept: encrypt and decrypt your files</h2><p>Creept never changes your originals: it always creates an encrypted (or decrypted) <b>copy</b> in the folder you choose.</p><h3>Encrypt</h3><ol><li>Drop files or folders on the right panel, or press <b>Add Source File or Folder</b>.</li><li>Choose the protection in the top bar. <b>Secure: AES-256-GCM</b> is the recommended one. <b>Options...</b> lets you combine AES-128, AES-256, a key image (StegaCREEPT) and Shuffle, choose how the password becomes a key (PBKDF2 or scrypt) and how folders are saved.</li><li>Type your password: the whole password counts, so a long phrase is best. If the mode needs a key image, choose it on the left (<b>One-Use</b> or from the Vault).</li><li>Press <b>Creept</b> and choose the destination: the result is saved in a new folder named with the date and time.</li></ol><h3>Decrypt</h3><ol><li>Drop the encrypted files: <i>.scpt</i> files, <i>.dir.scpt</i> archives or zips that contain them.</li><li>Type the password (and choose the key image, if the files need one). The selected mode does not matter: the algorithms are read from the file itself.</li><li>Press <b>DeCreept</b>. With a wrong password, or if the file was damaged or modified, nothing is written and you get an error.</li></ol><h3>Folders</h3><p>By default a folder becomes <b>one encrypted archive</b> (<i>name.dir.scpt</i>), so file names and structure stay hidden too. In <b>Options...</b> you can keep the folder structure with every file encrypted separately, or get a zip of encrypted files.</p><h3>Good to know</h3><ul><li>If you lose the password or the key image, nobody can recover your files. Keep a backup of your originals and of your keys, and never store them next to the encrypted files.</li><li>The line under the controls tells you how the current choice protects your data and how strong the password is. Rest the mouse on any control to read what it does.</li><li>The <b>Legacy</b> modes (old AES-128 and key image PNG files) exist only to open old files: prefer a <b>Secure</b> mode.</li><li>This module is still in beta and has not been reviewed by independent experts: do not rely on it as the only protection of important data.</li></ul>
