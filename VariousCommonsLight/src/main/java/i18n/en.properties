crypter.when_this_mode_is_active_an=When this mode is active, an additional phase will reorder bytes based on given key values, in order to increase algorithm security and maximize entrophy diffusion. <br/> <b>NB: </b> <u>When decrypting there's no need to choose the right option</u>, this will be recognized automatically from encoded image file name.
crypter.when_this_mode_is_active_the=When this mode is active, the given password will be hashed to avoid original password decription even if the data is compromised. <br/> <b>NB:</b> <u>When decrypting there's no need to choose the right option</u>, this will be recognized automatically from encoded file.
crypter.only_aes_mode_uses_aes_algorithm=<u>ONLY_AES mode</u> uses AES algorithm (128 bits) to encrypt/decrypt a copy of your data.<br/> To use this <u>you only have to specify a string password</u> (or generate a random new one.. just be sure to remember it). The best length is 16 characters.<br/><br/> <b>NB:</b> With this mode you can choose to hash password and/or shuffle original bytes to maximize security, but with a slower process.
crypter.only_steg_mode_uses_brand_new=<u>ONLY_STEG mode</u> uses brand new STEG algorithm to encrypt/decrypt a copy of your data. <br/>To use this you only have to specify a key image with PNG extension that will be your password.<br/> You can load a one-use only image, generate a new random image, or either choose one from your dictionary.<br/> <u>Without key image you won't be able to decrypt</u> the crypted copy of your data once it's crypted: keep it in a safe place! (I suggest you to use a usb Stick)<br/><br/> <b>NB:</b> With this mode you can choose to shuffle original bytes to maximize security, with a slower process, while key hashing is not supported.
crypter.complete_mode_is_the_maximum_security=<u>COMPLETE mode</u> is the maximum security mode, that combines AES 128 bits and STEG algorithm, in order to encrypt/decrypt a copy of your data. <br/> To use this you have to specify both AES password and key image with PNG extension that will be the added-password.<br/> You can load a one-use only image, generate a new random image, or either choose one from your dictionary: be careful and keep it in a safe place.<br/> <u>Without key password and image you won't be able to decrypt</u> the crypted copy of your data once it's crypted! (I suggest you to use a usb Stick)<br/><br/> <b>NB:</b> With this mode you can choose to hash password and/or shuffle original bytes to maximize security, but with a slower process.
