crypter.the_crypter_module_is_in_beta=<html><body style='width:430px'><b>Das Crypter-Modul befindet sich in der Beta-Phase.</b><br><br>Es ist experimentell und wurde noch nicht umfassend getestet. Seine Algorithmen wurden nicht von unabhängigen Experten geprüft: Verlassen Sie sich nicht allein darauf, um wichtige Daten zu schützen, und bewahren Sie eine unabhängige Kopie Ihrer Originaldateien und Ihrer Schlüssel auf. Ein Fehler oder ein verlorener Schlüssel kann dazu führen, dass verschlüsselte Dateien nicht wiederhergestellt werden können.<br><br>Updates in den kommenden Wochen und Monaten werden den Crypter und seine Integration in ScreepT verbessern und neue Funktionen hinzufügen.</body></html>
