crypter.when_this_mode_is_active_an=Wenn dieser Modus aktiv ist, ordnet eine zusätzliche Phase die Bytes anhand der Schlüsselwerte neu an, um die Sicherheit des Algorithmus zu erhöhen und die Entropieverteilung zu maximieren. <br/> <b>Hinweis: </b> <u>Beim Entschlüsseln muss die richtige Option nicht gewählt werden</u>: Sie wird automatisch am Namen der codierten Bilddatei erkannt.
crypter.when_this_mode_is_active_the=Wenn dieser Modus aktiv ist, wird das eingegebene Passwort gehasht, damit das ursprüngliche Passwort selbst bei kompromittierten Daten nicht ermittelt werden kann. <br/> <b>Hinweis:</b> <u>Beim Entschlüsseln muss die richtige Option nicht gewählt werden</u>: Sie wird automatisch an der codierten Datei erkannt.
crypter.only_aes_mode_uses_aes_algorithm=<u>Der Modus ONLY_AES</u> verwendet den AES-Algorithmus (128 Bit), um eine Kopie Ihrer Daten zu ver-/entschlüsseln.<br/> Dafür <u>genügt ein Textpasswort</u> (oder ein neu erzeugtes Zufallspasswort ... merken Sie es sich unbedingt). Die beste Länge sind 16 Zeichen.<br/><br/> <b>Hinweis:</b> In diesem Modus können Sie das Passwort hashen und/oder die Originalbytes mischen, um die Sicherheit zu maximieren – mit langsamerer Verarbeitung.
crypter.only_steg_mode_uses_brand_new=<u>Der Modus ONLY_STEG</u> verwendet den neuen STEG-Algorithmus, um eine Kopie Ihrer Daten zu ver-/entschlüsseln. <br/>Dafür genügt ein Schlüsselbild im PNG-Format, das Ihr Passwort ist.<br/> Sie können ein Einmalbild laden, ein neues Zufallsbild erzeugen oder eines aus Ihrem Wörterbuch wählen.<br/> <u>Ohne das Schlüsselbild können Sie</u> die verschlüsselte Kopie Ihrer Daten <u>nicht entschlüsseln</u>: Bewahren Sie es sicher auf! (ich empfehle einen USB-Stick)<br/><br/> <b>Hinweis:</b> In diesem Modus können Sie die Originalbytes mischen, um die Sicherheit zu maximieren – mit langsamerer Verarbeitung; Schlüssel-Hashing wird nicht unterstützt.
crypter.complete_mode_is_the_maximum_security=<u>Der Modus COMPLETE</u> ist der Modus mit maximaler Sicherheit: Er kombiniert AES mit 128 Bit und den STEG-Algorithmus, um eine Kopie Ihrer Daten zu ver-/entschlüsseln. <br/> Dafür müssen Sie sowohl das AES-Passwort als auch ein PNG-Schlüsselbild angeben, das als zusätzliches Passwort dient.<br/> Sie können ein Einmalbild laden, ein neues Zufallsbild erzeugen oder eines aus Ihrem Wörterbuch wählen: Seien Sie vorsichtig und bewahren Sie es sicher auf.<br/> <u>Ohne Passwort und Schlüsselbild können Sie</u> die verschlüsselte Kopie Ihrer Daten <u>nicht entschlüsseln</u>! (ich empfehle einen USB-Stick)<br/><br/> <b>Hinweis:</b> In diesem Modus können Sie das Passwort hashen und/oder die Originalbytes mischen, um die Sicherheit zu maximieren – mit langsamerer Verarbeitung.
